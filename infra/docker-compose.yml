version: "3.9"

services:
  # --------------------------------------------------------
  # Backend — FastAPI + Python
  # --------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: satquery-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./configs:/app/configs:ro
      - ./models:/app/models:ro
      - ./data/samples:/app/data/samples:ro
      - uploads_data:/app/uploads
      - outputs_data:/app/outputs
    environment:
      - APP_ENV=${APP_ENV:-development}
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - APP_DEBUG=${APP_DEBUG:-true}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-replace-in-prod}
      - UPLOAD_DIR=/app/uploads
      - OUTPUT_DIR=/app/outputs
      - MODEL_DEVICE=${MODEL_DEVICE:-cpu}
      - MODEL_QUANTIZATION=${MODEL_QUANTIZATION:-none}
      - VLM_ADAPTER_PATH=${VLM_ADAPTER_PATH:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # --------------------------------------------------------
  # Frontend — Next.js
  # --------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: satquery-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_APP_NAME=SatQuery AI
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  uploads_data:
  outputs_data:

networks:
  default:
    name: satquery-network
